<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>ParcelBridge v2 — Three-sided delivery coordination demo</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14283e;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding:0 18px}.top{background:#102a43;color:white}.topinner{display:flex;justify-content:space-between;align-items:center;min-height:72px;gap:12px}.logo{font-size:23px;font-weight:850;letter-spacing:-.7px}.logo span{color:#62d7c1}.pill{font-size:12px;border:1px solid #a4c2d3;border-radius:30px;padding:6px 10px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0}.nav button{border:1px solid #d7e2ea;background:white;color:#18324c;border-radius:11px;padding:10px 14px;white-space:nowrap}.nav button.active{background:#126e77;color:white;border-color:#126e77}main{padding:22px 0 70px}h1{font-size:clamp(26px,5vw,39px);letter-spacing:-1px;margin:0 0 10px}h2{font-size:21px;margin:0 0 16px}h3{margin:0 0 8px;font-size:17px}p{line-height:1.55}.muted{color:#62788b}.hero{background:linear-gradient(115deg,#102a43,#126e77);color:white;border-radius:20px;padding:30px;margin-bottom:20px}.hero p{max-width:650px;color:#d4e8ee}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid #dce6ee;border-radius:16px;padding:20px;box-shadow:0 3px 12px #15354b08;margin-bottom:16px}.stat{font-size:30px;font-weight:800;color:#126e77}.btn{border:0;background:#126e77;color:white;padding:11px 16px;border-radius:10px;font-weight:650}.btn.secondary{background:#e9f2f4;color:#165b65}.btn.danger{background:#fff0f0;color:#9e2525}.btn.small{padding:8px 11px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{display:inline-block;background:#e7f5f1;color:#096b58;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}.tag.pending{background:#fff2d9;color:#8a5800}.tag.rejected{background:#ffe7e7;color:#a02b2b}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #bfcedb;border-radius:10px;padding:11px;background:white;color:#14283e}.field textarea{min-height:95px;resize:vertical}.checkrow{display:flex;align-items:center;gap:10px;margin:10px 0}.checkrow input{width:18px;height:18px}.notice{background:#fff8e9;border:1px solid #efd8a8;border-radius:12px;padding:12px 15px;color:#73530e;margin:16px 0;font-size:14px}.success{background:#e7f6ed;border:1px solid #addcc0;color:#16673b;padding:12px;border-radius:10px;margin:12px 0}.parcel{display:flex;justify-content:space-between;gap:15px;align-items:center}.parcel .info{min-width:0}.parcel strong{display:block;margin-bottom:4px}.item{border-top:1px solid #e6edf3;padding:14px 0}.item:first-child{border:0;padding-top:0}.empty{padding:28px;text-align:center;color:#6d8191}.foot{text-align:center;font-size:12px;color:#64798c;padding:20px}.hidden{display:none!important}@media(max-width:760px){.grid,.grid.two{grid-template-columns:1fr}.topinner{min-height:65px}.hero{padding:23px}.parcel{align-items:flex-start;flex-direction:column}.pill{font-size:10px}}
</style></head><body><header class="top"><div class="shell topinner"><div class="logo">Parcel<span>Bridge</span></div><span class="pill">V2 DEMO · FICTIONAL DATA</span></div></header><div class="shell"><nav class="nav" id="nav" aria-label="Main navigation"></nav><main id="app"></main><footer class="foot">ParcelBridge concept demo · No live carrier connections · Data stays in this browser</footer></div><script>
const KEY='parcelbridge-demo-v1';const seed=()=>({profile:{name:'Alex Morgan',email:'alex@example.com',location:'Home address',days:['Monday','Tuesday','Wednesday','Thursday','Friday'],time:'Afternoon (12:00–18:00)',safePlace:'',notifications:true,permissions:{DHL:false,UPS:false,bpost:false}},parcels:[{id:'PB-1042',store:'Northline Fashion',carrier:'DHL',status:'In transit',eta:'2027-01-12'},{id:'PB-1043',store:'Studio Wardrobe',carrier:'UPS',status:'Preparing shipment',eta:'2027-01-15'},{id:'PB-1044',store:'Everyday Basics',carrier:'bpost',status:'Out for delivery',eta:'2027-01-10'}],requests:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed();if(!data.profile||!Array.isArray(data.parcels)||!Array.isArray(data.requests))throw Error('invalid')}catch{data=seed()}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pages=['Home','Recipient Profile','My Parcels','Delivery Changes','Retailer Dashboard','Courier Dashboard','AI Assistant'];let page='Home';let flash='';function notice(t){flash=t;render()}function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${esc(p)}">${esc(p)}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}function go(p){page=p;flash='';render();window.scrollTo({top:0,behavior:'smooth'})}function render(){nav();const views={'Home':home,'Recipient Profile':profile,'My Parcels':parcels,'Delivery Changes':changes,'Retailer Dashboard':retailer,'Courier Dashboard':courier,'AI Assistant':assistant};document.getElementById('app').innerHTML=(flash?`<div class="success" role="status">${esc(flash)}</div>`:'')+views[page]();wire()}function home(){return `<section class="hero"><h1>One recipient profile.<br>Multiple delivery networks.</h1><p>A neutral, AI-ready delivery coordination concept. Explore portable preferences, authorised delivery requests and retailer workflows in a safe fictional demo.</p><div class="actions"><button class="btn" data-go="My Parcels">Try the demo</button><button class="btn secondary" data-go="AI Assistant">Explore assistant</button></div></section><div class="grid"><div class="card"><div class="stat">${data.parcels.length}</div><p>Sample parcels</p></div><div class="card"><div class="stat">${data.requests.length}</div><p>Delivery requests</p></div><div class="card"><div class="stat">${Object.values(data.profile.permissions).filter(Boolean).length}/3</div><p>Demo sharing permissions enabled</p></div></div><div class="card"><h2>How it works</h2><div class="grid"><div><h3>1. Set preferences</h3><p class="muted">Choose preferred days, time windows and safe-place notes.</p></div><div><h3>2. Request changes</h3><p class="muted">Submit a fictional delivery change and track its status through a simulated retailer and courier workflow.</p></div><div><h3>3. Review outcomes</h3><p class="muted">Review retailer and courier decisions in the request history.</p></div></div></div><div class="notice">Demo only. Requests are stored locally and are never transmitted to DHL, UPS, bpost or any retailer.</div>`}
function profile(){let p=data.profile;return `<h1>Recipient Profile</h1><p class="muted">Preferences are saved on this device only.</p><form id="profileForm" class="card"><div class="grid two"><div class="field"><label for="name">Name (fictional)</label><input id="name" name="name" required maxlength="80" value="${esc(p.name)}"></div><div class="field"><label for="email">Email (fictional)</label><input id="email" name="email" type="email" required maxlength="100" value="${esc(p.email)}"></div><div class="field"><label for="location">Preferred delivery location</label><select id="location" name="location">${['Home address','Work address','Parcel locker','Pickup point'].map(x=>`<option ${x===p.location?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="time">Preferred time window</label><select id="time" name="time">${['Morning (08:00–12:00)','Afternoon (12:00–18:00)','Evening (18:00–21:00)','Any time'].map(x=>`<option ${x===p.time?'selected':''}>${x}</option>`).join('')}</select></div></div><h3>Preferred delivery days</h3><div class="actions">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>`<label class="checkrow"><input type="checkbox" name="days" value="${d}" ${p.days.includes(d)?'checked':''}>${d}</label>`).join('')}</div><div class="field"><label for="safePlace">Safe-place instructions (demo only)</label><textarea id="safePlace" name="safePlace" maxlength="500" placeholder="Example: leave with reception">${esc(p.safePlace)}</textarea></div><label class="checkrow"><input type="checkbox" name="notifications" ${p.notifications?'checked':''}>Enable demo notifications preference</label><h3>Carrier-sharing permissions (simulated)</h3><p class="muted">All permissions default to OFF. These switches do not share data with carriers.</p>${['DHL','UPS','bpost'].map(c=>`<label class="checkrow"><input type="checkbox" name="carrier-${c}" ${p.permissions[c]?'checked':''}>Allow simulated ${c} sharing</label>`).join('')}<div class="actions"><button class="btn" type="submit">Save profile</button><button class="btn secondary" type="button" id="resetProfile">Reset profile</button></div></form>`}
function parcels(){return `<h1>My Parcels</h1><p class="muted">Sample shipments for demonstration.</p>${data.parcels.map(p=>`<div class="card parcel"><div class="info"><strong>${esc(p.id)} · ${esc(p.store)}</strong><div class="muted">${esc(p.carrier)} · Estimated ${esc(p.eta)}</div><p><span class="tag">${esc(p.status)}</span></p></div><button class="btn small" data-manage="${esc(p.id)}">Manage delivery</button></div>`).join('')}`}
function changes(){return `<h1>Delivery Changes</h1><p class="muted">Submit a fictional request and review its history.</p><form class="card" id="requestForm"><h2>New request</h2><div class="field"><label for="parcelId">Parcel</label><select id="parcelId" name="parcelId">${data.parcels.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.carrier)} · ${esc(p.store)}</option>`).join('')}</select></div><div class="field"><label for="kind">Request type</label><select name="kind" id="kind"><option value="date">Change delivery date</option><option value="location">Change delivery location</option><option value="instructions">Add delivery instructions</option></select></div><div class="field"><label for="detail">Requested date, location or instructions</label><input name="detail" id="detail" required maxlength="250" placeholder="Example: Monday afternoon"></div><button class="btn" type="submit">Submit demo request</button><div class="notice">Submitting does not contact a carrier or change a real shipment.</div></form><div class="card"><h2>Request history</h2>${data.requests.length?data.requests.map(r=>`<div class="item"><div class="parcel"><div><strong>${esc(r.parcelId)} · ${esc(r.kind)}</strong><p>${esc(r.detail)}</p><span class="muted">${esc(r.created)}</span> <span class="tag ${r.status==='Rejected by courier'?'rejected':r.status==='Accepted by courier'?'':'pending'}">${esc(r.status)}</span></div><button class="btn danger small" data-delete="${esc(r.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No requests yet. Create one above.</div>'}</div>`}
function retailer(){let total=data.requests.length;let waiting=data.requests.filter(r=>!r.status||r.status==='Pending (demo)').length;return `<h1>Retailer Dashboard</h1><p class="muted">Simulated retailer workspace. All requests are fictional and stored only on this device.</p><div class="grid"><div class="card"><div class="stat">${data.parcels.length}</div>Sample shipments</div><div class="card"><div class="stat">${total}</div>Delivery requests</div><div class="card"><div class="stat">${waiting}</div>Awaiting retailer review</div></div><div class="card"><h2>Review delivery requests</h2>${total?data.requests.map(r=>`<div class="item"><strong>${esc(r.parcelId)} · ${esc(r.kind)}</strong><p>${esc(r.detail)}</p><span class="tag ${r.status==='Rejected by courier'?'rejected':'pending'}">${esc(r.status)}</span>${(!r.status||r.status==='Pending (demo)')?`<div class="actions"><button class="btn small" data-forward="${esc(r.id)}">Forward to courier (simulation)</button><button class="btn secondary small" data-retailer-decline="${esc(r.id)}">Decline request</button></div>`:''}</div>`).join(''):'<p class="muted">No requests submitted yet. Create one in Delivery Changes.</p>'}</div><div class="notice">Forwarding only updates this browser's demo data. No courier or recipient receives a message.</div><div class="card"><h2>Demo controls</h2><p class="muted">Reset the fictional sample parcels, requests and preferences.</p><button class="btn danger" id="clearData">Clear all demo data</button></div>`}
function courier(){const queued=data.requests.filter(r=>r.status==='Forwarded to courier (demo)');return `<h1>Courier Dashboard</h1><p class="muted">A proposed carrier operations view — not connected to any delivery company.</p><div class="grid two"><div class="card"><div class="stat">${queued.length}</div>Requests awaiting courier decision</div><div class="card"><div class="stat">${data.requests.filter(r=>r.status==='Accepted by courier').length}</div>Accepted in simulation</div></div><div class="card"><h2>Incoming authorised-request simulation</h2>${queued.length?queued.map(r=>{const parcel=data.parcels.find(p=>p.id===r.parcelId);return `<div class="item"><strong>${esc(r.parcelId)} · ${esc(parcel?.carrier||'Demo courier')}</strong><p><b>Request:</b> ${esc(r.kind)} — ${esc(r.detail)}</p><p class="muted">Retailer forwarded this fictional request. No identity, authority or operational feasibility has been verified.</p><div class="actions"><button class="btn small" data-courier-accept="${esc(r.id)}">Accept (demo)</button><button class="btn secondary small" data-courier-reject="${esc(r.id)}">Reject (demo)</button></div></div>`}).join(''):'<div class="empty">No forwarded requests. Submit a request as a recipient, then forward it from the retailer dashboard.</div>'}</div><div class="card"><h2>Courier decision history</h2>${data.requests.filter(r=>['Accepted by courier','Rejected by courier'].includes(r.status)).map(r=>`<div class="item"><strong>${esc(r.parcelId)}</strong><p>${esc(r.detail)}</p><span class="tag ${r.status==='Rejected by courier'?'rejected':''}">${esc(r.status)}</span></div>`).join('')||'<p class="muted">No courier decisions yet.</p>'}</div><div class="notice">Demo decisions do not change any real shipment. Production use requires authenticated carrier access, recipient authorisation, carrier agreements, audit trails and secure server-side records.</div>`}
function parseRequest(t){const s=t.toLowerCase();const days=[...s.matchAll(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/g)].map(x=>x[1]);let type='General delivery request';if(/locker|pickup point|neighbou?r|reception|safe place|work address/.test(s))type='Location or drop-off preference';else if(/monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|date|later|earlier/.test(s))type='Delivery date preference';const loc=/locker/.test(s)?'Parcel locker':/neighbou?r/.test(s)?'Neighbour':/reception/.test(s)?'Reception':/safe place/.test(s)?'Safe place':/work address/.test(s)?'Work address':'Not specified';return {type,day:days.length?days[days.length-1]:'Not specified',location:loc,warning:'Carrier approval required. No request has been sent.'}}
function assistant(){return `<h1>AI Delivery Assistant</h1><p class="muted">Explore how a future AI assistant might interpret natural-language delivery requests.</p><div class="card"><div class="notice">This offline demonstration uses simple text rules, not a real AI model. It cannot verify identity, understand every request or contact carriers.</div><div class="field"><label for="assistantText">Describe a delivery preference</label><textarea id="assistantText" placeholder="I won't be home on Friday. Please deliver on Monday instead.">I won't be home on Friday. Please deliver on Monday instead.</textarea></div><button class="btn" id="interpret">Interpret request</button><div id="assistantResult" aria-live="polite"></div></div>`}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{go('Delivery Changes');document.getElementById('parcelId').value=b.dataset.manage;document.getElementById('detail').focus()});const pf=document.getElementById('profileForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf);data.profile={name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),location:f.get('location'),time:f.get('time'),days:f.getAll('days'),safePlace:f.get('safePlace'),notifications:f.has('notifications'),permissions:Object.fromEntries(['DHL','UPS','bpost'].map(c=>[c,f.has('carrier-'+c)]))};save();notice('Profile saved on this device.')};const reset=document.getElementById('resetProfile');if(reset)reset.onclick=()=>{if(confirm('Reset recipient profile to fictional defaults?')){data.profile=seed().profile;save();notice('Profile reset.')}};const rf=document.getElementById('requestForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf);const detail=String(f.get('detail')).trim();if(!detail)return;data.requests.unshift({id:'REQ-'+Date.now(),parcelId:f.get('parcelId'),kind:f.get('kind'),detail,status:'Pending (demo)',created:new Date().toLocaleString()});save();notice('Demo request saved. No carrier was contacted.')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this demo request?')){data.requests=data.requests.filter(r=>r.id!==b.dataset.delete);save();notice('Request deleted.')}});document.querySelectorAll('[data-forward]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.forward);if(r&&(!r.status||r.status==='Pending (demo)')){r.status='Forwarded to courier (demo)';save();notice('Forwarded in this device only. No courier was contacted.')}});document.querySelectorAll('[data-retailer-decline]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.retailerDecline);if(r&&(!r.status||r.status==='Pending (demo)')){r.status='Declined by retailer';save();notice('Retailer decision saved in demo.')}});document.querySelectorAll('[data-courier-accept]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.courierAccept);if(r&&r.status==='Forwarded to courier (demo)'){r.status='Accepted by courier';save();notice('Simulated acceptance recorded. No shipment was changed.')}});document.querySelectorAll('[data-courier-reject]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.courierReject);if(r&&r.status==='Forwarded to courier (demo)'){r.status='Rejected by courier';save();notice('Simulated rejection recorded.')}});const clear=document.getElementById('clearData');if(clear)clear.onclick=()=>{if(confirm('Clear ALL demo data on this device? This cannot be undone.')){data=seed();save();notice('Demo data restored to defaults.')}};const interpret=document.getElementById('interpret');if(interpret)interpret.onclick=()=>{const text=document.getElementById('assistantText').value.trim();if(!text)return;const r=parseRequest(text);document.getElementById('assistantResult').innerHTML=`<div class="card" style="margin-top:16px;background:#f1f8f8"><h3>Interpreted request</h3><p><strong>Type:</strong> ${esc(r.type)}</p><p><strong>Preferred day:</strong> ${esc(r.day)}</p><p><strong>Location:</strong> ${esc(r.location)}</p><p class="muted">${esc(r.warning)}</p></div>`}}render();
</script></body></html>
